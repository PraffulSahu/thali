# Security headers for every response. nginx drops server-level add_header directives inside any location
# that declares its own add_header, so web.conf includes this snippet at server level AND in every such
# location. Installed as /etc/nginx/snippets/thali-security-headers.conf by apps/web/Dockerfile.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
