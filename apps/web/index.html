<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Admin reset links carry a one-time token: never send it as a Referer, not even for the app's own assets. */
      if (location.pathname.indexOf('/admin/reset-password') === 0) {
        var m = document.createElement('meta');
        m.name = 'referrer';
        m.content = 'no-referrer';
        document.head.appendChild(m);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Thali: order from restaurants near you, mix dishes from different kitchens in one checkout, and track every delivery live." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* No-flash theme: same rules as src/lib/theme.tsx (localStorage `thali.theme`: light | dark | system). */
      (function () {
        var d = false;
        try {
          var p = localStorage.getItem('thali.theme');
          d = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        var r = document.documentElement;
        r.setAttribute('data-theme', d ? 'dark' : 'light');
        r.style.colorScheme = d ? 'dark' : 'light';
        if (d) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d0c0c');
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <title>Thali — order from many kitchens, pay once</title>
  </head>
  <body>
    <noscript>Thali needs JavaScript to run. Please enable it in your browser.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
